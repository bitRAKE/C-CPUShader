<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Diagnostic — Color & Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090c;
    --surface: #101218;
    --border: #1e2230;
    --accent: #00e5a0;
    --accent2: #00b4ff;
    --text: #e0e4ef;
    --muted: #5a6178;
    --warn: #ff5f5f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  .badge {
    font-size: 10px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .controls {
    display: flex;
    gap: 6px;
    padding: 16px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  .controls label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-right: 4px;
  }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s ease;
    letter-spacing: 0.02em;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 8px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 120px);
    background: #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay-info {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    line-height: 1.6;
    background: rgba(8,9,12,0.85);
    padding: 10px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    max-width: 340px;
  }

  .overlay-info strong { color: var(--text); }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1><span>&#9632;</span> MONITOR DIAGNOSTIC</h1>
  <div class="badge" id="res-badge">--</div>
</header>

<div class="controls">
  <label>Test:</label>
  <button class="btn active" data-test="gradient">RGB Gradient</button>
  <button class="btn" data-test="hsv">HSV Wheel</button>
  <button class="btn" data-test="banding">Banding Steps</button>
  <button class="btn" data-test="gamma">Gamma Ramp</button>
  <button class="btn" data-test="motion">Motion Response</button>
  <button class="btn" data-test="strobe">Strobe / Flicker</button>
  <button class="btn" data-test="pixels">Sub-pixel Grid</button>

  <div class="divider"></div>

  <div class="speed-control">
    <label>Speed:</label>
    <input type="range" id="speed" min="0" max="200" value="60">
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="gl"></canvas>
  <div class="overlay-info" id="info"></div>
</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: false, antialias: false });
const info = document.getElementById('info');
const resBadge = document.getElementById('res-badge');

let currentTest = 'gradient';
let speedMul = 0.6;
let animFrame;
let startTime = performance.now();

// --- Shader sources ---

const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fragSrc = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform int u_test;
uniform float u_speed;

// Attempt to cover wide gamut visually
vec3 hsv2rgb(vec3 c) {
  vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0,4,2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return c.z * mix(vec3(1.0), rgb, c.y);
}

// Smooth banding test: N quantized steps
float quantize(float v, float steps) {
  return floor(v * steps + 0.5) / steps;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  float t = u_time * u_speed;
  vec3 col = vec3(0.0);

  // === RGB GRADIENT ===
  if (u_test == 0) {
    // Horizontal: R gradient, Vertical: mixed
    float r = uv.x;
    float g = uv.y;
    float b = 1.0 - uv.x * 0.5 - uv.y * 0.5;

    // Animated diagonal wave for response-time observation
    float wave = sin((uv.x + uv.y) * 20.0 - t * 3.0) * 0.5 + 0.5;
    wave *= 0.06;

    col = vec3(r, g, b) + wave;

    // Add subtle pulsing border glow
    float edge = smoothstep(0.0, 0.03, min(min(uv.x, 1.0-uv.x), min(uv.y, 1.0-uv.y)));
    col *= edge;
  }

  // === HSV WHEEL ===
  else if (u_test == 1) {
    vec2 centered = (uv - 0.5) * vec2(aspect, 1.0);
    float angle = atan(centered.y, centered.x) / 6.28318 + 0.5;
    float radius = length(centered);

    // Spinning hue
    float hue = fract(angle + t * 0.1);
    float sat = smoothstep(0.0, 0.15, radius) * smoothstep(0.5, 0.45, radius);
    float val = 1.0;

    col = hsv2rgb(vec3(hue, sat, val));

    // Center marker
    float centerDot = smoothstep(0.02, 0.015, radius);
    col = mix(col, vec3(1.0), centerDot);

    // Ring markers for saturation steps
    for (int i = 1; i <= 4; i++) {
      float r2 = float(i) * 0.1;
      float ring = abs(radius - r2) < 0.002 ? 1.0 : 0.0;
      col = mix(col, vec3(0.3), ring * 0.4);
    }
  }

  // === BANDING STEPS ===
  else if (u_test == 2) {
    float steps[5];
    steps[0] = 8.0; steps[1] = 16.0; steps[2] = 32.0; steps[3] = 64.0; steps[4] = 256.0;

    int row = int(uv.y * 5.0);
    float rowF = fract(uv.y * 5.0);
    float n = 256.0;
    if (row == 0) n = 8.0;
    else if (row == 1) n = 16.0;
    else if (row == 2) n = 32.0;
    else if (row == 3) n = 64.0;
    else n = 256.0;

    float val = quantize(uv.x, n);

    // Animated gradient overlay
    float animGrad = sin(t * 2.0 + uv.x * 10.0) * 0.02;
    val = clamp(val + animGrad, 0.0, 1.0);

    col = vec3(val);

    // Row separators
    float sep = 1.0 - smoothstep(0.0, 0.003, abs(rowF - 0.5) - 0.497);
    col = mix(col, vec3(0.0, 1.0, 0.6), sep * 0.3);

    // Label area
    if (uv.x < 0.06) {
      float labelStripe = step(0.5, fract(uv.y * 5.0));
      col = mix(vec3(0.06), col, smoothstep(0.06, 0.07, uv.x));
    }
  }

  // === GAMMA RAMP ===
  else if (u_test == 3) {
    float x = uv.x;

    // Three rows: linear, gamma 2.2, gamma 1.8
    int row = int(uv.y * 3.0);
    float rowF = fract(uv.y * 3.0);

    float v = x;
    if (row == 0) v = pow(x, 1.0);     // Linear
    else if (row == 1) v = pow(x, 2.2); // sRGB-ish
    else v = pow(x, 1.8);                // 1.8

    // Animated: slide a reference line
    float refLine = abs(x - fract(t * 0.15));
    float marker = smoothstep(0.005, 0.0, refLine);

    col = vec3(v);
    col = mix(col, vec3(1.0, 0.2, 0.3), marker * 0.8);

    // Sep
    float sep = 1.0 - smoothstep(0.0, 0.003, abs(rowF - 0.5) - 0.497);
    col = mix(col, vec3(0.0, 0.8, 1.0), sep * 0.4);
  }

  // === MOTION RESPONSE ===
  else if (u_test == 4) {
    col = vec3(0.02);

    // Moving block — test ghosting / motion blur
    float blockSize = 0.06;
    float speed = t * 1.2;
    float xPositions[4];
    xPositions[0] = fract(speed * 0.7) * 1.4 - 0.2;
    xPositions[1] = fract(speed * 0.5 + 0.25) * 1.4 - 0.2;
    xPositions[2] = fract(speed * 0.9 + 0.5) * 1.4 - 0.2;
    xPositions[3] = fract(speed * 0.3 + 0.75) * 1.4 - 0.2;

    vec3 blockColors[4];
    blockColors[0] = vec3(1.0, 1.0, 1.0); // White
    blockColors[1] = vec3(1.0, 0.0, 0.0); // Red
    blockColors[2] = vec3(0.0, 1.0, 0.0); // Green
    blockColors[3] = vec3(0.0, 0.5, 1.0); // Blue

    for (int i = 0; i < 4; i++) {
      float yCenter = 0.125 + float(i) * 0.25;
      float bx = abs(uv.x - xPositions[i]);
      float by = abs(uv.y - yCenter);
      if (bx < blockSize && by < 0.08) {
        col = blockColors[i];
      }
    }

    // Vertical reference lines
    float gridLine = step(0.998, fract(uv.x * 20.0));
    col += gridLine * 0.08;

    // Horizontal row guides
    for (int i = 0; i < 4; i++) {
      float yCenter = 0.125 + float(i) * 0.25;
      float guide = smoothstep(0.002, 0.0, abs(uv.y - yCenter) - 0.09);
      col = mix(col, vec3(0.15, 0.18, 0.25), guide * 0.5);
    }
  }

  // === STROBE / FLICKER ===
  else if (u_test == 5) {
    float freq = 4.0 + sin(t * 0.3) * 2.0; // Varying frequency
    float strobe = step(0.5, fract(t * freq));

    // Alternating columns
    float colStripe = step(0.5, fract(uv.x * 40.0));
    float combined = strobe * colStripe;

    // Full white flash on some cycles
    float flash = step(0.95, fract(t * 0.5)) * strobe;

    col = vec3(combined * 0.8 + flash * 0.2);

    // Invert test region
    if (uv.y > 0.5) {
      col = vec3(1.0) - col;
    }

    // Center zone: pure flicker
    if (abs(uv.x - 0.5) < 0.15 && abs(uv.y - 0.5) < 0.15) {
      col = vec3(strobe);
    }
  }

  // === SUB-PIXEL GRID ===
  else if (u_test == 6) {
    // Zoom into pixel structure
    float zoom = 12.0 + sin(t * 0.5) * 2.0;
    vec2 grid = fract(uv * vec2(u_res.x / zoom, u_res.y / zoom));

    // RGB sub-pixel simulation
    float subR = smoothstep(0.33, 0.335, grid.x) * (1.0 - smoothstep(0.66, 0.665, grid.x));
    float subG = step(0.66, grid.x);
    float subB = step(0.66, 1.0 - grid.x);

    // Vertical stripe
    float stripe = smoothstep(0.4, 0.45, grid.y) * (1.0 - smoothstep(0.55, 0.6, grid.y));

    col = vec3(subR, subG, subB) * stripe;

    // Grid lines
    float gx = abs(fract(grid.x * 3.0) - 0.5);
    float gy = abs(grid.y - 0.5);
    float gridMask = 1.0 - smoothstep(0.0, 0.02, min(gx, gy));
    col = mix(col, vec3(0.2), gridMask * 0.5);

    // Background
    col = max(col, vec3(0.03));
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

// --- Compile ---
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = compileShader(vertSrc, gl.VERTEX_SHADER);
const fs = compileShader(fragSrc, gl.FRAGMENT_SHADER);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// Fullscreen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uTest = gl.getUniformLocation(prog, 'u_test');
const uSpeed = gl.getUniformLocation(prog, 'u_speed');

const testMap = { gradient:0, hsv:1, banding:2, gamma:3, motion:4, strobe:5, pixels:6 };

const testInfo = {
  gradient: `<strong>RGB Gradient</strong><br>Full-range R/G/B mixing. Look for:<br>· Smooth gradients vs visible banding<br>· Color accuracy across the sweep<br>· Subtle wave animation for response`,
  hsv: `<strong>HSV Color Wheel</strong><br>Hue/saturation coverage test.<br>· Check for smooth hue transitions<br>· Verify saturation falloff toward center<br>· Rotating = response time test`,
  banding: `<strong>Banding Steps</strong><br>8 → 16 → 32 → 64 → 256 levels.<br>· How many steps can you distinguish?<br>· Top rows = fewer levels (harder)<br>· Bottom = 256 (should be smooth)`,
  gamma: `<strong>Gamma Ramp</strong><br>Linear / γ2.2 / γ1.8 comparison.<br>· Middle row should look most "natural"<br>· Moving red marker = motion clarity<br>· Reveals non-linear display response`,
  motion: `<strong>Motion Response</strong><br>Colored blocks at different speeds.<br>· Check for ghosting / smearing<br>· Compare R, G, B motion artifacts<br>· Higher speed = more stress test`,
  strobe: `<strong>Strobe / Flicker</strong><br>Variable-frequency flicker test.<br>· Detect PWM flicker sensitivity<br>· Inverted zone (top) for persistence<br>· Center = pure black-white strobe`,
  pixels: `<strong>Sub-pixel Grid</strong><br>Zoomed RGB stripe layout.<br>· Verify sub-pixel arrangement<br>· Check for dead/stuck pixels<br>· Zoom oscillates to reveal structure`
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
  resBadge.textContent = `${canvas.width}×${canvas.height} @${dpr}x`;
}

function render() {
  const t = (performance.now() - startTime) / 1000;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform1i(uTest, testMap[currentTest]);
  gl.uniform1f(uSpeed, speedMul);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  animFrame = requestAnimationFrame(render);
}

// Controls
document.querySelectorAll('.btn[data-test]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-test]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTest = btn.dataset.test;
    info.innerHTML = testInfo[currentTest];
  });
});

document.getElementById('speed').addEventListener('input', e => {
  speedMul = e.target.value / 100;
});

window.addEventListener('resize', resize);
resize();
info.innerHTML = testInfo.gradient;
render();
</script>
</body>
</html>
